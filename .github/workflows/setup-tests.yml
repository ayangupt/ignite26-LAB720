name: Self-serve setup checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/setup-tests.yml'
  push:
    paths:
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/setup-tests.yml'

permissions:
  contents: read

jobs:
  content:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup using synthetic repositories and the published final checkpoint
        shell: pwsh
        run: ./scripts/tests/content.Tests.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download the public checkpoint and run its final gateway tests
        shell: ${{ runner.os == 'Windows' && 'powershell' || 'pwsh' }}
        run: ./scripts/tests/review-final.Tests.ps1
