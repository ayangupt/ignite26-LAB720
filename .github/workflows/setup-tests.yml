name: Self-serve setup checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/setup-tests.yml'
  push:
    paths:
      - 'scripts/**'
      - 'infra/**'
      - '.github/workflows/setup-tests.yml'

permissions:
  contents: read

jobs:
  content:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup using synthetic repositories and the published final checkpoint
        shell: pwsh
        run: ./scripts/tests/content.Tests.ps1
